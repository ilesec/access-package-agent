name: Deploy Function App

on:
  push:
    branches: [main]
    paths:
      - "function_app.py"
      - "src/**"
      - "requirements.txt"
      - "host.json"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - prod

permissions:
  id-token: write
  contents: read

jobs:
  deploy-func:
    name: Build & Deploy Function App
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies for Linux
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt \
            --target=".python_packages/lib/site-packages" \
            --platform manylinux2014_x86_64 \
            --python-version 3.11 \
            --only-binary=:all:

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create deployment package
        run: |
          cd ${{ github.workspace }}
          zip -r funcapp.zip function_app.py host.json requirements.txt src/ .python_packages/

      - name: Deploy to Azure Functions
        run: |
          az functionapp deployment source config-zip \
            --resource-group ${{ vars.RESOURCE_GROUP }} \
            --name ${{ vars.FUNCTION_APP_NAME }} \
            --src funcapp.zip

      - name: Trigger initial sync
        continue-on-error: true
        run: |
          FUNC_KEY=$(az functionapp keys list \
            --name ${{ vars.FUNCTION_APP_NAME }} \
            --resource-group ${{ vars.RESOURCE_GROUP }} \
            --query "masterKey" --output tsv)

          curl -sf -X POST \
            "https://${{ vars.FUNCTION_APP_NAME }}.azurewebsites.net/admin/functions/syncAccessPackages" \
            -H "x-functions-key: $FUNC_KEY" \
            -H "Content-Type: application/json" \
            -d '{"input":""}' || echo "Sync trigger failed (non-fatal)"
